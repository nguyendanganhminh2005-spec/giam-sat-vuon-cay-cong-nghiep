<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giám sát vườn cà phê – hồ tiêu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--lagoon:#12394a;--water:#6cc5d1;--water-d:#3a9fb0;--bg:#eef2ea;--ink:#26201b;--mute:#6d7068;--cherry:#c8402b;--leaf:#3e7c4a;--line:#d5dcd0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:100vh}

/* ---- Cột độ ẩm ---- */
.gauge-panel{background:var(--lagoon);color:#e9f4f3;padding:32px 28px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:1.5rem;line-height:1.2;font-weight:800}
.pill{font-size:.8rem;padding:3px 12px;border-radius:99px;border:1px solid #ffffff55;white-space:nowrap}
.pill.on{background:#bfe9c9;color:#14401f;border-color:#bfe9c9}
.gauge{display:flex;align-items:center;gap:8px;flex:1;min-height:0}
.gauge svg{height:100%;max-height:420px;width:auto;flex:0 0 auto}
.readout{display:flex;flex-direction:column}
.humi-value{font-size:clamp(4.5rem,9vw,6.5rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.readout .u{font-size:1.5rem;font-weight:500;opacity:.7}
.readout small{opacity:.7;margin-top:4px}
#advice{margin:0;font-size:1rem;padding-top:14px;border-top:1px solid #ffffff33}
.water{transition:y .8s ease,height .8s ease}
.drops circle{fill:var(--water);opacity:0}
.misting .drops circle{animation:fall 1.4s linear infinite}
.drops circle:nth-child(2){animation-delay:.3s!important}.drops circle:nth-child(3){animation-delay:.7s!important}
.drops circle:nth-child(4){animation-delay:1s!important}
@keyframes fall{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(90px)}}

/* ---- Nội dung chính ---- */
main{padding:32px clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:36px;max-width:900px}
h2{margin:0 0 6px;font-size:1rem;font-weight:600;color:var(--mute)}
.top{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end}
.temp-value{font-size:4rem;font-weight:800;line-height:1;color:var(--cherry);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.top .u{font-size:1.4rem;color:var(--mute);font-weight:500}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;margin-top:14px}
.bar i{position:absolute;top:-5px;width:6px;height:16px;border-radius:3px;background:var(--cherry);transform:translateX(-50%);transition:left .6s}
.mist{font-size:1.5rem;font-weight:600}
.mist.run{color:var(--water-d)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:32px;border-top:1px solid var(--line);padding-top:28px}
.chart{position:relative;height:210px}
.controls{border-top:1px solid var(--line);padding-top:28px}
.sw-row{display:flex;flex-wrap:wrap;gap:16px}
.sw{display:flex;align-items:center;gap:16px;flex:1;min-width:240px;padding:14px 18px;border:2px solid var(--ink);border-radius:14px;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background .2s,color .2s}
.sw .knob{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw .knob::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}
.sw b{display:block;font-size:1.05rem}
.sw span{font-size:.85rem;opacity:.75}
.sw[aria-checked="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sw[aria-checked="true"] .knob{background:#ffffff55}
.sw[aria-checked="true"] .knob::after{transform:translateX(22px)}
.sw:focus-visible{outline:3px solid var(--water-d);outline-offset:3px}
.foot{font-size:.85rem;color:var(--mute);margin:14px 0 0}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .gauge-panel{position:static;height:auto}
  .gauge{height:340px;flex:none}
  .top,.charts{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.water,.bar i,.misting .drops circle{transition:none;animation:none}}
</style>
</head>
<body>
<div class="app">

<aside class="gauge-panel" id="panel">
  <div class="brand">
    <h1>Vườn cà phê<br>và hồ tiêu</h1>
    <span id="conn" class="pill">Đang kết nối…</span>
  </div>

  <div class="gauge">
    <svg viewBox="0 0 150 380" role="img" aria-label="Cột đo độ ẩm">
      <defs><clipPath id="tube"><rect x="20" y="20" width="70" height="340" rx="35"/></clipPath></defs>
      <rect x="20" y="20" width="70" height="340" rx="35" fill="#ffffff14" stroke="#ffffff66" stroke-width="2"/>
      <g clip-path="url(#tube)">
        <rect class="water" id="water" x="20" y="360" width="70" height="0" fill="var(--water)"/>
        <rect x="20" y="156" width="70" height="68" fill="#ffffff" opacity=".16"/>
      </g>
      <g class="drops" id="drops"><circle cx="40" cy="40" r="3.5"/><circle cx="55" cy="34" r="3"/><circle cx="68" cy="42" r="3.5"/><circle cx="78" cy="36" r="2.5"/></g>
      <g stroke="#ffffff99" stroke-width="2"><line x1="96" x2="112" y1="156" y2="156"/><line x1="96" x2="112" y1="224" y2="224"/></g>
      <g fill="#e9f4f3" font-size="12" font-family="inherit">
        <text x="116" y="160">60%</text><text x="116" y="228">40%</text>
        <text x="116" y="364" opacity=".6">0</text><text x="116" y="28" opacity=".6">100</text>
      </g>
    </svg>
    <div class="readout">
      <div><span class="humi-value" id="humi">--</span><span class="u">%</span></div>
      <small>Độ ẩm<br>Vùng tốt: 40–60%</small>
    </div>
  </div>

  <p id="advice">Đang chờ dữ liệu từ ESP32…</p>
</aside>

<main>
  <section class="top">
    <div>
      <h2>Nhiệt độ</h2>
      <div><span class="temp-value" id="temp">--</span><span class="u"> °C</span></div>
      <div class="bar"><i id="tempMark" style="left:0"></i></div>
    </div>
    <div>
      <h2>Máy phun sương</h2>
      <div class="mist" id="mist">Tắt</div>
      <h2 style="margin-top:10px">Cập nhật lúc</h2>
      <div id="stamp">--:--:--</div>
    </div>
  </section>

  <section class="charts">
    <div><h2>Độ ẩm (%)</h2><div class="chart"><canvas id="chH"></canvas></div></div>
    <div><h2>Nhiệt độ (°C)</h2><div class="chart"><canvas id="chT"></canvas></div></div>
  </section>

  <section class="controls">
    <h2>Điều khiển thủ công</h2>
    <div class="sw-row">
      <button class="sw" id="btnPump" role="switch" aria-checked="false"><i class="knob"></i><div><b>Máy bơm</b><span id="pumpTxt">Đang tắt</span></div></button>
      <button class="sw" id="btnFan" role="switch" aria-checked="false"><i class="knob"></i><div><b>Quạt</b><span id="fanTxt">Đang tắt</span></div></button>
    </div>
    <p class="foot">Máy phun sương chạy tự động theo độ ẩm. Bơm và quạt do bạn bật tắt.</p>
  </section>
</main>
</div>

<script>
const BROKER="wss://broker.hivemq.com:8884/mqtt";
const T_DATA="vuon_cay_cn/data",T_STATUS="vuon_cay_cn/status",T_PUMP="vuon_cay_cn/cmd/pump",T_FAN="vuon_cay_cn/cmd/fan";
const T_PUMP_ST="vuon_cay_cn/state/pump",T_FAN_ST="vuon_cay_cn/state/fan";
const pending={pump:0,fan:0};   // thời điểm vừa bấm, tạm bỏ qua số liệu cũ từ ESP32
const HOLD=3000;
const $=id=>document.getElementById(id);
const st={pump:false,fan:false};

function mkChart(id,color,fill,lines){
  const ds=[{data:[],borderColor:color,backgroundColor:fill,fill:true,borderWidth:2.5,pointRadius:0,tension:.35}];
  (lines||[]).forEach(v=>ds.push({data:[],_v:v,borderColor:"#3e7c4a88",borderDash:[5,5],borderWidth:1.5,pointRadius:0,fill:false}));
  return new Chart($(id),{type:"line",data:{labels:[],datasets:ds},options:{animation:false,maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false},ticks:{maxTicksLimit:5,color:"#6d7068"}},y:{grid:{color:"#d5dcd0"},ticks:{color:"#6d7068"}}}}});
}
const chH=mkChart("chH","#3a9fb0","#6cc5d133",[40,60]);
const chT=mkChart("chT","#c8402b","#c8402b1f");
function push(ch,v){
  const d=ch.data;d.labels.push(new Date().toLocaleTimeString("vi-VN"));
  d.datasets.forEach((s,i)=>s.data.push(i===0?v:s._v));
  if(d.labels.length>40){d.labels.shift();d.datasets.forEach(s=>s.data.shift())}
  ch.update();
}
function sw(btn,txt,on){btn.setAttribute("aria-checked",on);txt.textContent=on?"Đang bật":"Đang tắt"}

function render(d){
  $("temp").textContent=d.t.toFixed(1);
  $("humi").textContent=d.h.toFixed(1);
  $("tempMark").style.left=Math.min(100,Math.max(0,(d.t-15)/25*100))+"%";
  $("stamp").textContent=new Date().toLocaleTimeString("vi-VN");

  const hh=Math.min(100,Math.max(0,d.h))/100*340;
  $("water").setAttribute("y",360-hh);$("water").setAttribute("height",hh);

  const run=d.mist>0;
  $("mist").textContent=run?"Đang phun, "+d.mist+"% công suất":"Tắt";
  $("mist").classList.toggle("run",run);
  $("panel").classList.toggle("misting",run);

  $("advice").textContent = d.h<40 ? (run?"Độ ẩm thấp hơn 40%. Máy phun sương đang làm việc.":"Độ ẩm thấp hơn 40%. Máy sẽ phun ở lần đo tới.")
                          : d.h>60 ? "Độ ẩm cao hơn 60%. Nên bật quạt để thông thoáng."
                          : "Độ ẩm đang trong vùng ổn định.";

  if(Date.now()-pending.pump>HOLD){st.pump=!!d.pump;sw($("btnPump"),$("pumpTxt"),st.pump)}
  if(Date.now()-pending.fan>HOLD){st.fan=!!d.fan;sw($("btnFan"),$("fanTxt"),st.fan)}
  push(chH,d.h);push(chT,d.t);
}

const client=mqtt.connect(BROKER);
client.on("connect",()=>{$("conn").textContent="Đã kết nối";$("conn").classList.add("on");client.subscribe([T_DATA,T_STATUS,T_PUMP_ST,T_FAN_ST])});
client.on("close",()=>{$("conn").textContent="Mất kết nối";$("conn").classList.remove("on")});
client.on("message",(topic,payload)=>{
  const s=payload.toString();
  if(topic===T_PUMP_ST){st.pump=s==="ON";pending.pump=0;sw($("btnPump"),$("pumpTxt"),st.pump);return}
  if(topic===T_FAN_ST){st.fan=s==="ON";pending.fan=0;sw($("btnFan"),$("fanTxt"),st.fan);return}
  if(topic===T_STATUS){ if(s==="offline"){$("conn").textContent="ESP32 ngoại tuyến";$("conn").classList.remove("on")} return }
  let d;try{d=JSON.parse(s)}catch{return}
  $("conn").textContent="ESP32 trực tuyến";$("conn").classList.add("on");
  render(d);
});
// Bấm là đổi giao diện ngay (optimistic), sau đó gửi lệnh; ESP32 sẽ xác nhận lại
function toggle(key,btn,txt,topic){
  st[key]=!st[key];pending[key]=Date.now();
  sw(btn,txt,st[key]);
  client.publish(topic,st[key]?"ON":"OFF");
}
$("btnPump").onclick=()=>toggle("pump",$("btnPump"),$("pumpTxt"),T_PUMP);
$("btnFan").onclick=()=>toggle("fan",$("btnFan"),$("fanTxt"),T_FAN);
</script>
</body>
</html>
